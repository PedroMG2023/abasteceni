# Entorno de pruebas de sistema (CLAUDE.md §6; DIS-14): PostgreSQL, migraciones,
# siembra del Administrador, API, trabajador e interfaz. Los secretos llegan por
# variables de entorno; la CI los genera al azar en cada ejecución.
name: abasteceni-sistema

x-artefacto: &artefacto
  build:
    context: .
    target: artefacto
  image: abasteceni-artefacto:sistema

x-entorno-app: &entorno-app
  URL_BD_APP: postgresql://abasteceni_app:${CLAVE_APP_BD:?}@postgres:5432/abasteceni
  SECRETO_FIRMA_ACCESO: ${SECRETO_FIRMA_ACCESO:?}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CLAVE_SUPERUSUARIO_BD:?}
      CLAVE_PROPIETARIO_BD: ${CLAVE_PROPIETARIO_BD:?}
      CLAVE_APP_BD: ${CLAVE_APP_BD:?}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ./herramientas/bd/provisionar.sh:/docker-entrypoint-initdb.d/provisionar.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d abasteceni']
      interval: 2s
      retries: 30

  migraciones:
    <<: *artefacto
    command: ['node', 'dist/scripts/migrar.js']
    environment:
      URL_BD_PROPIETARIO: postgresql://abasteceni_propietario:${CLAVE_PROPIETARIO_BD:?}@postgres:5432/abasteceni
    depends_on:
      postgres:
        condition: service_healthy

  sembrar:
    <<: *artefacto
    command: ['node', 'dist/scripts/sembrar-administrador.js']
    environment:
      <<: *entorno-app
      CORREO_ADMINISTRADOR: ${CORREO_ADMINISTRADOR:?}
      CONTRASENA_ADMINISTRADOR: ${CONTRASENA_ADMINISTRADOR:?}
    depends_on:
      migraciones:
        condition: service_completed_successfully

  api:
    <<: *artefacto
    command: ['node', 'dist/src/main.api.js']
    environment:
      <<: *entorno-app
      PUERTO_API: '3000'
      ORIGEN_WEB: http://localhost:8080
      # El entorno de sistema local no termina TLS; en producción la cookie es Secure.
      COOKIE_SEGURA: 'false'
      PROXIES_CONFIABLES: '1'
    depends_on:
      sembrar:
        condition: service_completed_successfully

  trabajador:
    <<: *artefacto
    command: ['node', 'dist/src/main.trabajador.js']
    environment:
      <<: *entorno-app
      SIMULACION_WHATSAPP: disponible
    depends_on:
      sembrar:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
