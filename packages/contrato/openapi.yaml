openapi: 3.0.3
info:
  title: AbasteceNi — API REST
  version: 0.1.0
  description: |
    Contrato de interfaz de la plataforma AbasteceNi. Es la fuente de verdad
    entre la interfaz cliente y el servicio de aplicación (PA-07, ADR-06) y
    documenta los servicios expuestos conforme a SYS-NFN-16. Los recursos y su
    módulo responsable siguen el catálogo de D3 §2.9.2.
  license:
    name: Uso interno de AbasteceNi, S.A.
    url: https://github.com/PedroMG2023/abasteceni
servers:
  - url: /api/v1
    description: Servicio de aplicación (MD-03, MD-05)
security:
  - credencialAcceso: []
tags:
  - name: Plataforma
    description: Operación de la plataforma (D3 R-03, sondas de vitalidad)
  - name: Cuentas
    description: M1 Usuarios y validación (SYS-FN-01 a 03)
  - name: Sesiones
    description: M2 Seguridad y sesiones (SYS-FN-04; ADR-04, PA-04)
paths:
  /salud:
    get:
      tags: [Plataforma]
      operationId: consultarSalud
      summary: Consultar la vitalidad del servicio de aplicación
      description: |
        Sonda de vitalidad que consume el balanceador para el reinicio
        automático de instancias (D3 R-03, MD-05). No requiere credencial.
      security: []
      responses:
        '200':
          description: El proceso de aplicación atiende peticiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: operativo
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /cuentas:
    post:
      tags: [Cuentas]
      operationId: registrarCuenta
      summary: Registrar una cuenta comercial
      description: |
        Registra una cuenta comercial en estado «Pendiente de validación»
        (SYS-FN-01, CT-REG-01). Además de los campos de SYS-FN-01 captura el
        tipo de cuenta (DIS-17), el teléfono móvil (DIS-19), el correo y la
        contraseña (DIS-16), el documento de registro legal (SYS-FN-02,
        CT-REG-02; DIS-29) y la aceptación del consentimiento (SYS-FN-36,
        DIS-28). La cuenta, los asientos de bitácora y el evento CuentaRegistrada
        se persisten en la misma transacción (ADR-01, SYS-FN-35).
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitudRegistroCuenta'
            encoding:
              registroLegal:
                contentType: application/pdf, image/jpeg
      responses:
        '201':
          description: Cuenta registrada, pendiente de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaRegistrada'
              example:
                id: 7f3c9a7e-2b1d-4c55-9a8e-2f1b6c0d9e11
                estado: Pendiente de validación
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          $ref: '#/components/responses/DocumentoDemasiadoGrande'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    get:
      tags: [Cuentas]
      operationId: listarCuentas
      summary: Listar las cuentas comerciales
      description: |
        Lista las cuentas comerciales, opcionalmente filtradas por estado, para
        el panel del Administrador de la plataforma (SYS-FN-03). Contiene datos
        personales (V-03): solo el Administrador accede.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoCuenta'
      responses:
        '200':
          description: Cuentas comerciales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumenCuenta'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /cuentas/{id}:
    patch:
      tags: [Cuentas]
      operationId: validarCuenta
      summary: Aprobar o rechazar una solicitud de cuenta comercial
      description: |
        Decisión del Administrador de la plataforma (SYS-FN-03, CT-ADM-03). La
        transición pertenece a la máquina de estados de M1 (D3 §2.9.2) y el
        resultado, con la justificación, consta en la bitácora inmutable
        (SYS-FN-35, ADR-05). El rechazo exige justificación (DIS-23).
      parameters:
        - $ref: '#/components/parameters/IdCuenta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionCuenta'
            example:
              decision: rechazar
              justificacion: El documento cargado no corresponde al RUC indicado.
      responses:
        '200':
          description: Cuenta validada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenCuenta'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /cuentas/{id}/registro-legal:
    get:
      tags: [Cuentas]
      operationId: obtenerRegistroLegal
      summary: Descargar el documento de registro legal de una cuenta
      description: |
        Documento cargado en el registro (SYS-FN-02) para la revisión del
        Administrador (D1 PM-01, actividad 4). Dato personal (V-03).
      parameters:
        - $ref: '#/components/parameters/IdCuenta'
      responses:
        '200':
          description: Documento de registro legal.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /sesiones:
    post:
      tags: [Sesiones]
      operationId: iniciarSesion
      summary: Iniciar sesión con correo y contraseña
      description: |
        Concede acceso y asigna el rol al iniciar la sesión (SYS-FN-04). Emite
        una credencial de acceso firmada de vida corta y una credencial de
        renovación en una cookie HttpOnly (ADR-04, DIS-06). Tras 5 intentos
        fallidos consecutivos la cuenta se bloquea 15 minutos y se avisa al
        correo registrado (SYS-FN-07, DIS-34): responde 403 con el código
        CUENTA_BLOQUEADA. Una cuenta comercial mantiene como máximo dos
        sesiones; al abrir la tercera se revoca la renovación de la de inicio
        más antiguo (SYS-FN-08, DIS-37).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudInicioSesion'
      responses:
        '201':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionIniciada'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /sesiones/renovacion:
    post:
      tags: [Sesiones]
      operationId: renovarSesion
      summary: Renovar la credencial de acceso
      description: |
        Emite una credencial de acceso nueva a partir de la credencial de
        renovación y rota esta última (ADR-04, DIS-06). La anterior queda
        revocada. Si la sesión fue desplazada por un tercer dispositivo
        responde 401 con el código SESION_DESPLAZADA (SYS-FN-08, DIS-37).
      security:
        - credencialRenovacion: []
      responses:
        '201':
          description: Credenciales renovadas.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/CookieRenovacion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionIniciada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /sesiones/recuperacion:
    post:
      tags: [Sesiones]
      operationId: solicitarRecuperacion
      summary: Solicitar un enlace de restablecimiento de contraseña
      description: |
        Envía al correo registrado un enlace de un solo uso, válido 15 minutos
        (SYS-FN-05, DIS-36). Responde 202 con el mismo aviso exista o no el
        correo, para no revelar qué cuentas están registradas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecuperacion'
      responses:
        '202':
          description: Solicitud recibida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aviso'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /sesiones/recuperacion/restablecimiento:
    post:
      tags: [Sesiones]
      operationId: restablecerContrasena
      summary: Restablecer la contraseña con el secreto del enlace
      description: |
        Fija la contraseña nueva, revoca todas las sesiones de la cuenta y
        levanta el bloqueo por intentos fallidos (SYS-FN-05, DIS-36). El
        enlace queda usado. Si venció o ya se usó responde 410.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRestablecimiento'
      responses:
        '200':
          description: Contraseña restablecida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aviso'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '410':
          $ref: '#/components/responses/EnlaceVencido'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /sesiones/actual:
    get:
      tags: [Sesiones]
      operationId: consultarSesionActual
      summary: Consultar la identidad de la sesión actual
      responses:
        '200':
          description: Identidad y rol de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidad'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    delete:
      tags: [Sesiones]
      operationId: cerrarSesion
      summary: Cerrar la sesión actual
      description: Revoca la credencial de renovación de la sesión (ADR-04).
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
components:
  securitySchemes:
    credencialAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Credencial de acceso firmada de vida corta (ADR-04, PA-04).
    credencialRenovacion:
      type: apiKey
      in: cookie
      name: abasteceni_renovacion
      description: Credencial de renovación en cookie HttpOnly, SameSite=Strict, ruta /api/v1/sesiones (ADR-04).
  parameters:
    IdCuenta:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    CookieRenovacion:
      description: Cookie HttpOnly con la credencial de renovación, válida 7 días (DIS-06).
      schema:
        type: string
  responses:
    SolicitudInvalida:
      description: La solicitud no cumple las validaciones (PA-05).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Ya existe una cuenta con ese RUC o con ese correo, o la cuenta ya fue validada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: El recurso indicado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocumentoDemasiadoGrande:
      description: El documento de registro legal supera 5 MB (SYS-FN-02, CT-REG-02).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Falta la credencial, es inválida o ha expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: El rol o el estado de la cuenta no autoriza la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnlaceVencido:
      description: El enlace de restablecimiento venció o ya fue usado (SYS-FN-05, DIS-36).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: ENLACE_VENCIDO
            mensaje: El enlace venció o ya fue usado. Solicite uno nuevo.
    DemasiadasPeticiones:
      description: Se superó el límite de 120 peticiones por minuto por IP (SYS-NFN-03, ADR-08).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DEMASIADAS_PETICIONES
            mensaje: Se superó el límite de peticiones. Intente de nuevo en un minuto.
  schemas:
    TipoCuenta:
      type: string
      description: Tipo de cuenta comercial (MD-01; DIS-17).
      enum: [Comprador, Proveedor, Productor]
    Rol:
      type: string
      description: Rol asignado al iniciar la sesión (SYS-FN-04).
      enum: [Comprador, Proveedor, Productor, Administrador]
    EstadoCuenta:
      type: string
      description: Estado de la cuenta comercial (D2 SYS-FN-01 y 03; DIS-23).
      enum: [Pendiente de validación, Activa, Rechazada]
    SolicitudRegistroCuenta:
      type: object
      additionalProperties: false
      required: [tipo, razonSocial, ruc, departamento, municipio, rubro, telefonoMovil, correo, contrasena, aceptaConsentimiento, registroLegal]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoCuenta'
        razonSocial:
          type: string
          maxLength: 200
        ruc:
          type: string
          description: «J» y 13 dígitos, o 13 dígitos y una letra (DIS-21).
          maxLength: 14
        departamento:
          type: string
          maxLength: 100
        municipio:
          type: string
          maxLength: 100
        rubro:
          type: string
          maxLength: 100
        telefonoMovil:
          type: string
          description: Formato internacional UIT-T E.164 (DIS-19).
          maxLength: 16
        correo:
          type: string
          maxLength: 254
        contrasena:
          type: string
          description: Entre 12 y 128 caracteres (DIS-22).
          minLength: 12
          maxLength: 128
        aceptaConsentimiento:
          type: boolean
          description: Aceptación de la declaración de consentimiento de DIS-28 (SYS-FN-36, Ley No. 787). Debe ser true.
        registroLegal:
          type: string
          format: binary
          description: Cédula RUC o patente municipal en PDF o JPG, máximo 5 MB; el tipo se comprueba por contenido (SYS-FN-02).
    ValidacionCuenta:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [aprobar, rechazar]
        justificacion:
          type: string
          maxLength: 500
          description: Obligatoria al rechazar (DIS-23).
    CuentaRegistrada:
      type: object
      additionalProperties: false
      required: [id, estado]
      properties:
        id:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoCuenta'
    ResumenCuenta:
      type: object
      additionalProperties: false
      required: [id, tipo, razonSocial, ruc, departamento, municipio, rubro, estado, registradaEn, consentimientoAceptadoEn, registroLegalTipo]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoCuenta'
        razonSocial:
          type: string
        ruc:
          type: string
        departamento:
          type: string
        municipio:
          type: string
        rubro:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCuenta'
        registradaEn:
          type: string
          format: date-time
        consentimientoAceptadoEn:
          type: string
          format: date-time
        registroLegalTipo:
          type: string
          enum: [application/pdf, image/jpeg]
    SolicitudInicioSesion:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          maxLength: 254
        contrasena:
          type: string
          maxLength: 128
    SesionIniciada:
      type: object
      additionalProperties: false
      required: [credencialAcceso, tipo, expiraEnSegundos, rol]
      properties:
        credencialAcceso:
          type: string
          description: Credencial firmada de vida corta (15 minutos, DIS-06).
        tipo:
          type: string
          enum: [Bearer]
        expiraEnSegundos:
          type: integer
        rol:
          $ref: '#/components/schemas/Rol'
    SolicitudRecuperacion:
      type: object
      additionalProperties: false
      required: [correo]
      properties:
        correo:
          type: string
          maxLength: 254
    SolicitudRestablecimiento:
      type: object
      additionalProperties: false
      required: [secreto, contrasena]
      properties:
        secreto:
          type: string
          description: Secreto de un solo uso recibido en el enlace (SYS-FN-05).
          maxLength: 256
        contrasena:
          type: string
          description: Contraseña nueva, entre 12 y 128 caracteres (DIS-22).
          minLength: 12
          maxLength: 128
    Aviso:
      type: object
      additionalProperties: false
      required: [mensaje]
      properties:
        mensaje:
          type: string
          description: Mensaje para la persona usuaria, en español.
    Identidad:
      type: object
      additionalProperties: false
      required: [rol]
      properties:
        rol:
          $ref: '#/components/schemas/Rol'
        cuentaId:
          type: string
          format: uuid
          nullable: true
    Salud:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [operativo]
    Error:
      type: object
      description: Forma uniforme de los errores (D3 §2.9.1, manejo uniforme de errores).
      required: [codigo, mensaje]
      additionalProperties: false
      properties:
        codigo:
          type: string
          description: Código estable y legible por máquina.
        mensaje:
          type: string
          description: Mensaje para la persona usuaria, en español.
        detalles:
          type: array
          description: Errores de validación por campo, cuando proceda.
          items:
            $ref: '#/components/schemas/ErrorCampo'
    ErrorCampo:
      type: object
      required: [campo, mensaje]
      additionalProperties: false
      properties:
        campo:
          type: string
        mensaje:
          type: string
