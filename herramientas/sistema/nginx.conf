# Entorno de pruebas de sistema: nginx sirve los activos de la interfaz y reenvía
# /api al servicio de aplicación, como harían la red de distribución de
# contenido y el balanceador en producción (MD-05).
server {
  listen 80;
  root /usr/share/nginx/html;

  # SYS-NFN-10: activos comprimidos (en producción lo hace la red de distribución, ADR-06).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
