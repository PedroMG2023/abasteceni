# PostgreSQL local de desarrollo (ADR-07, IT-00). Las pruebas usan su propio
# contenedor efímero con Testcontainers (control 8.31 de ISO/IEC 27002:2022).
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CLAVE_SUPERUSUARIO_BD:?Defina CLAVE_SUPERUSUARIO_BD en .env}
      CLAVE_PROPIETARIO_BD: ${CLAVE_PROPIETARIO_BD:?Defina CLAVE_PROPIETARIO_BD en .env}
      CLAVE_APP_BD: ${CLAVE_APP_BD:?Defina CLAVE_APP_BD en .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./herramientas/bd/provisionar.sh:/docker-entrypoint-initdb.d/provisionar.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d abasteceni']
      interval: 5s
      retries: 10

volumes:
  datos-postgres:
